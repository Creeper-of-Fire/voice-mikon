<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音输入</title>
<!-- 本地样式，无任何外链资源，离线可用 -->
<link rel="stylesheet" href="capsule.css">
</head>
<body>
  <div class="stack" id="stack">
    <!-- 上方：文字条。录音时是实时预览,结束/出错/取消时定格成最终文案 -->
    <div class="textbar" id="textbar">
      <div class="textbar-text" id="textbarText"></div>
    </div>

    <!-- 下方：胶囊。结构移植自 OpenType 的 recording-pill（AGPL-3.0）
         phase 类由 capsule.js 切换：recording / processing / done / error / cancelled
         胶囊本体（非按钮区）在「自定义」位置模式下是拖拽把手 -->
    <div class="recording-pill recording" id="pill" role="status" aria-label="语音输入状态">
      <!-- 常驻悬浮球的图标。
           悬浮球**不是另一个元素** —— 它就是这颗胶囊缩起来的样子:
           待机时胶囊收成 40px 的正圆(见 capsule.css 的「常驻悬浮球」),
           这个图标显示在球里;开始录音时整个胶囊横向拉长,
           图标淡出,换成波形/计时/按钮。 -->
      <span class="bar-orb" id="barOrb" aria-hidden="true">
        <svg class="orb-mic" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" x2="12" y1="19" y2="22" />
        </svg>
        <!-- 模型加载中:球上转圈(代替麦克风),提示"还不能录"。
             动画用现成的 bar-spin,颜色随球(红底深图标)。 -->
        <svg class="orb-loader" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </span>

      <!-- 取消：放弃这一轮,不识别不注入 -->
      <button class="bar-cancel" id="cancelBtn" type="button" aria-label="取消录音">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>

      <div class="bar-content">
        <!-- 录音中：13 根滚动电平条（MiniMax Code 的 asr-volume-bars 规格） -->
        <div class="waveform" id="waveform"></div>
        <!-- 非录音态：一行状态文字 -->
        <span class="bar-label" id="barLabel"></span>
        <!-- 录音计时 -->
        <span class="bar-timer" id="barTimer">0:00</span>
      </div>

      <!-- 结束录音：等同再按一次热键 -->
      <button class="bar-stop" id="okBtn" type="button" aria-label="结束录音">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </button>

      <!-- 非录音态：右侧状态图标（处理中转圈 / 完成对勾 / 出错提示） -->
      <span class="bar-state" id="barState">
        <svg class="icon-loader" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg class="icon-info" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>
      </span>

      <!-- 错误态：手动把识别结果复制到剪贴板。
           注入失败时那段话既没进目标窗口、也可能没留在剪贴板里，
           这个按钮是用户唯一能把内容捞回来的出口。
           写进去并读回校验通过后，Python 侧会自己把胶囊收掉。 -->
      <button class="bar-copy" id="copyBtn" type="button" aria-label="复制识别结果">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 悬浮球的右键菜单:通用功能入口。
       用户定的形态:一个展示框,里面一排小圆圈,以后加新功能都往这里放。
       目前两项:打开设置面板 / 退出程序(和托盘同一条退出路径)。
       默认隐藏;在球上右键时由 capsule.js 显示。
       ⚠ 菜单显示时命中区(SetWindowRgn)必须把它框进来,否则点不到
       (见 capsule.js 的 measureRegions)。 -->
  <div class="orb-menu" id="orbMenu" hidden>
    <button class="orb-menu-btn" id="menuSettings" type="button" aria-label="打开设置面板" title="设置">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <button class="orb-menu-btn orb-menu-quit" id="menuQuit" type="button" aria-label="退出程序" title="退出">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
        <line x1="12" x2="12" y1="2" y2="12" />
      </svg>
    </button>
  </div>

  <!-- 球的操作提示(点球时模型还在加载等):球上方冒出的一句话,几秒后自己淡掉 -->
  <div class="orb-hint" id="orbHint" hidden></div>

  <!-- 本地脚本，无任何外链资源 -->
  <script src="capsule.js"></script>
</body>
</html>
