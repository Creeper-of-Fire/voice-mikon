[project]
name = "voice-mikon"
version = "0.1.0"
description = "Windows 全局语音输入法 + 小工具集合:按热键(或点悬浮球)说话,文字直接打进光标处"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pystray>=0.19",
    "pillow>=10.0",
    "pywebview>=6.2",
    "torch>=2.6",
    "transformers==4.57.6",
    "qwen-asr==0.0.6",
    "soundfile>=0.12",
    # 预览断句的 Silero VAD 判定层跑在 ONNX Runtime 上(CPU 版即可)。
    #   为什么不用 torch —— 网络 ASR 后端本来可以零 torch,却会被
    #   TorchScript 版 VAD 把 torch 拖进来(几百 MB 内存)。
    #   换 ONNX 后判定结果几乎逐帧一致(实测最大概率偏差 1.7e-06)。
    "onnxruntime>=1.17",
    # 网络 ASR 后端(MiniMax)要用的两个:
    #   scipy —— 重采样(resample_poly,多相滤波,带抗混叠低通)。
    #            之前它只是 librosa 的传递依赖,这里显式声明,
    #            免得网络后端绑死在隐式传递依赖上。
    #   httpx —— 发 HTTP 请求(multipart 上传音频)。
    "scipy>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 术语表管理器(scripts/hotwords_manager.py scan)需要分词器
# pip install -e ".[hotwords]"
hotwords = ["jieba>=0.42"]

# 附属工具「二维码扫描」(companions/qr_scanner,悬浮球右键菜单拉起)
# 用的两个,装不上不影响语音本体 —— 菜单点击时工具自己会弹窗报告。
#   mss —— 多显示器截屏(物理像素坐标系,与选区窗口一致)
#   pyzbar —— zbar 码解码(Windows wheel 自带 DLL,零外部依赖)
# pip install -e ".[qr]"
qr = ["mss>=10", "pyzbar>=0.1.9"]

[project.scripts]
voice-mikon = "voice_mikon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_mikon"]
