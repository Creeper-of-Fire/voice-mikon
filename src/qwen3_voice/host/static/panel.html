<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 声明支持双色:浏览器原生部件(滚动条等)也跟着系统主题走 -->
<meta name="color-scheme" content="light dark">
<title>语音输入</title>
<!-- 本地样式，无任何外链资源，离线可用 -->
<link rel="stylesheet" href="panel.css">
</head>
<!-- st-* 是状态类，由 panel.js 依据 window.__panel.setState 切换 -->
<body class="st-idle">
  <div class="panel">
    <!-- 标题栏：可拖动区域 -->
    <header class="titlebar" id="titlebar">
      <span class="dot" id="stateDot" data-state="idle" title="状态"></span>
      <span class="title">语音输入</span>
      <!-- 关闭按钮只是隐藏面板，不退出程序 -->
      <button class="icon-btn" id="closeBtn" type="button" title="隐藏面板" aria-label="隐藏面板">✕</button>
    </header>

    <!-- 面板已经是"配置窗口"了：录音过程的反馈全在胶囊窗口里 -->
    <main class="content">
      <!-- 状态区：当前状态 + 识别后端的健康度。
           健康度三态(加载中/就绪/失败)都摆在这一行，
           失败原因另外一行常驻显示 —— 加载失败必须让人看见**原因**，
           只摆一个"失败"等于让用户自己去猜。 -->
      <div class="status-row">
        <span class="row-label">状态</span>
        <span class="state-text" id="stateText">待机</span>
        <span class="health-badge" id="healthBadge" data-health="loading">加载中</span>
      </div>
      <p class="health-reason" id="healthReason" hidden></p>

      <!-- 识别后端：本地模型 / 网络 API（互斥，同一时刻只留一个） -->
      <div class="option-row">
        <span class="row-label">后端</span>
        <div class="seg is-text" id="backendSeg" role="group" aria-label="识别后端">
          <button class="seg-item is-active" type="button" data-backend="local" title="本地 Qwen3-ASR 模型：离线、零等待，模型常驻显存">本地</button>
          <button class="seg-item" type="button" data-backend="dashscope" title="阿里云百炼网络接口：音频出本机，有网络延迟，不支持实时预览">网络</button>
        </div>
      </div>

      <!-- 后端相关的说明（网络模式下才显示）——行为差异必须写出来，不能静默失效 -->
      <p class="hint" id="backendHint" hidden></p>

      <!-- 模型切换 -->
      <div class="option-row" id="modelRow">
        <span class="row-label">模型</span>
        <div class="seg" id="modelSeg" role="group" aria-label="模型切换">
          <button class="seg-item is-active" type="button" data-model="0.6B">0.6B</button>
          <button class="seg-item" type="button" data-model="1.7B">1.7B</button>
        </div>
      </div>

      <!-- 主题:跟随系统 / 白天 / 黑夜(面板和胶囊一起换) -->
      <div class="option-row">
        <span class="row-label">主题</span>
        <div class="seg is-text" id="themeSeg" role="group" aria-label="主题切换">
          <button class="seg-item is-active" type="button" data-theme-mode="auto" title="跟随 Windows 的应用主题">自动</button>
          <button class="seg-item" type="button" data-theme-mode="light" title="强制浅色">白天</button>
          <button class="seg-item" type="button" data-theme-mode="dark" title="强制深色">黑夜</button>
        </div>
      </div>

      <!-- 常驻悬浮球:屏幕上常驻一颗小球,点它开始录音,拖它挪位置。 -->
      <div class="option-row">
        <span class="row-label">悬浮球</span>
        <label class="switch" id="orbSwitch" title="屏幕上常驻一颗悬浮球:点它开始录音,拖它可以挪位置">
          <input type="checkbox" id="orbToggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <!-- 悬浮球的待机策略:窗口常驻 / 待机时销毁窗口(零占用)。
           这是"待不待机",和"球在哪儿"是两回事 —— 位置档位已退役,
           这里只留待机这一档。 -->
      <div class="option-row">
        <span class="row-label">待机</span>
        <div class="seg is-text" id="standbySeg" role="group" aria-label="悬浮球待机策略">
          <button class="seg-item is-active" type="button" data-standby="resident" title="窗口常驻:球一直待在屏幕上,热键反馈即时">常驻</button>
          <button class="seg-item" type="button" data-standby="on_demand" title="待机时整个窗口销毁:零 WebView2/GPU 占用,热键时再拉起">按需</button>
        </div>
      </div>

      <!-- 预览文字条:关掉之后胶囊只剩波形+计时+按钮,不挡屏幕 -->
      <div class="option-row" id="previewRow">
        <span class="row-label">预览</span>
        <label class="switch" id="previewSwitch" title="录音时显示实时预览文字">
          <input type="checkbox" id="previewToggle" checked>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <!-- 操作提示(切换后端的进展/拒绝/失败都走这里) -->
      <p class="notice" id="notice" role="status" aria-live="polite"></p>

      <footer class="footer">
        <!-- "热键" 是静态标签,按键组合由 panel.js 写进 kbd(OpenType 的键帽样式) -->
        <span class="hotkey"><span class="hotkey-label">热键</span><kbd id="hotkeyLabel">Ctrl+Alt+V</kbd></span>
        <button class="link-btn" id="quitBtn" type="button" title="退出程序">退出</button>
      </footer>
    </main>
  </div>

  <!-- 本地脚本，无任何外链资源 -->
  <script src="panel.js"></script>
</body>
</html>
