[project]
name = "qwen3-voice"
version = "0.1.0"
description = "基于本地 Qwen3-ASR 的全局语音输入 —— 按热键说话,文字直接打进光标处"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pystray>=0.19",
    "pillow>=10.0",
    "pywebview>=6.2",
    "torch>=2.6",
    "transformers==4.57.6",
    "qwen-asr==0.0.6",
    "soundfile>=0.12",
    # 网络 ASR 后端(阿里云百炼)要用的两个:
    #   scipy —— 重采样(resample_poly,多相滤波,带抗混叠低通)。
    #            之前它只是 librosa 的传递依赖,这里显式声明,
    #            免得网络后端绑死在隐式传递依赖上。
    #   httpx —— 发 HTTP 请求(OpenAI 兼容端点)。
    "scipy>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 术语表管理器(scripts/hotwords_manager.py scan)需要分词器
# pip install -e ".[hotwords]"
hotwords = ["jieba>=0.42"]

# 「跟随输入」位置模式要用 UI Automation 读光标位置(现代应用)。
# 装不上也不影响使用 —— 定位会退到更弱的手段(传统控件光标 → 鼠标 →
# 前台窗口矩形),只是没那么准。
# pip install -e ".[uia]"
uia = ["comtypes>=1.2"]

# 附属工具「二维码扫描」(companions/qr_scanner,悬浮球右键菜单拉起)
# 用的两个,装不上不影响语音本体 —— 菜单点击时工具自己会弹窗报告。
#   mss —— 多显示器截屏(物理像素坐标系,与选区窗口一致)
#   pyzbar —— zbar 码解码(Windows wheel 自带 DLL,零外部依赖)
# pip install -e ".[qr]"
qr = ["mss>=10", "pyzbar>=0.1.9"]

[project.scripts]
qwen3-voice = "qwen3_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3_voice"]
