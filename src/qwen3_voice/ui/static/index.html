<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音输入</title>
<!-- 本地样式，无任何外链资源，离线可用 -->
<link rel="stylesheet" href="panel.css">
</head>
<!-- st-* 是状态类，由 panel.js 依据 window.__qwen.setState 切换 -->
<body class="st-idle">
  <div class="panel">
    <!-- 标题栏：可拖动区域 -->
    <header class="titlebar" id="titlebar">
      <span class="dot" id="stateDot" data-state="idle" title="状态"></span>
      <span class="title">语音输入</span>
      <!-- 关闭按钮只是隐藏面板，不退出程序 -->
      <button class="icon-btn" id="closeBtn" type="button" title="隐藏面板" aria-label="隐藏面板">✕</button>
    </header>

    <main class="content">
      <!-- 主按钮：待机 / 录音中 / 识别中 三态 -->
      <button class="main-btn" id="mainBtn" type="button">● 开始录音</button>

      <!-- 滚动电平条卡片（对齐 MiniMax Code 的 asr-volume-bars）
           22 根条从右往左滚动：JS 只改每根条的 transform（位置）和 height（高度），
           高度由真实音量序列经非线性映射得到，不画任何假动画。
           待机 / 识别中不显示条形，只显示一行居中提示文字 -->
      <section class="card card-level" id="levelCard">
        <div class="wave-stage">
          <div class="wave-viewport" id="waveViewport">
            <div class="wave-bars" id="waveBars"></div>
            <!-- 左侧渐变遮罩：让条子"从虚无中浮现" -->
            <div class="wave-mask"></div>
          </div>
          <div class="wave-hint" id="waveHint">按 Ctrl+Alt+Space 开始说话</div>
        </div>
      </section>

      <!-- 状态行：左状态文字 + 右等宽计时 -->
      <div class="status-row">
        <span class="status-text tone-dim" id="statusText">待机</span>
        <span class="timer" id="timer">0.0s</span>
      </div>

      <!-- 模型切换 -->
      <div class="model-row">
        <span class="row-label">模型</span>
        <div class="seg" id="modelSeg" role="group" aria-label="模型切换">
          <button class="seg-item is-active" type="button" data-model="0.6B">0.6B</button>
          <button class="seg-item" type="button" data-model="1.7B">1.7B</button>
        </div>
      </div>

      <!-- 识别结果预览：可换行、左对齐、超长内部滚动
           栈内上下两段：上半是录音过程中的实时部分结果（灰色、临时），
           下半是停止录音后的最终结果（正常色）；两者不同时显示 -->
      <section class="card card-result is-empty" id="resultCard">
        <div class="result-stack" id="resultStack">
          <!-- 实时部分结果：灰色 + 左侧竖线，暗示"这是临时的" -->
          <div class="result-partial" id="resultPartial"></div>
          <!-- 最终识别结果 -->
          <div class="result-text" id="resultText"></div>
        </div>
        <!-- 占位 / 状态提示：待机、录音中（还没有 partial）、识别中 -->
        <div class="result-empty" id="resultEmpty">识别结果将显示在这里</div>
      </section>

      <footer class="footer">
        <span class="hotkey" id="hotkeyLabel">热键 Ctrl+Alt+V</span>
        <button class="link-btn" id="quitBtn" type="button" title="退出程序">退出</button>
      </footer>
    </main>
  </div>

  <!-- 本地脚本，无任何外链资源 -->
  <script src="panel.js"></script>
</body>
</html>
